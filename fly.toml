app = "diamond-bot"
primary_region = "ams"

[build]

[http_service]
internal_port = 8080
force_https = true
# Never scale to zero — this is the whole point of leaving Render's free
# tier (which suspended the service after a usage-limit hit). A real
# always-on machine, paid per second it runs, not a hard monthly quota.
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
# 256mb OOM-killed the process every ~10-15s in real production testing
# (aiogram + SQLAlchemy/asyncpg + aiohttp + Pillow for the receipt image
# generator add up fast) — bumped to 512mb, the smallest size that
# actually stayed up.
memory = "512mb"
