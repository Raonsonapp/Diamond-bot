name: Deploy FF MARGEDAR to Hugging Face Spaces
run-name: Deploy latest main to Hugging Face

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Hugging Face app files
        run: |
          test -f app.py
          test -f requirements.txt
          grep -q "@spaces.GPU" app.py
          grep -q "^spaces" requirements.txt
          echo "ZeroGPU entrypoint and dependency are present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Upload latest application to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("Missing GitHub Actions secret: HF_TOKEN")

          api = HfApi(token=token)
          api.upload_folder(
              repo_id="Mahmadmurodov/ff-margedar-bot",
              repo_type="space",
              folder_path=".",
              commit_message="Deploy latest main from GitHub Actions",
              ignore_patterns=[
                  ".git/**", ".github/**", ".env", ".env.*",
                  ".venv/**", "venv/**", "__pycache__/**",
                  "*.pyc", "*.db", "*.sqlite3",
              ],
          )
          print("Latest main successfully uploaded to Hugging Face Space.")
          PY
