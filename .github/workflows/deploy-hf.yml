name: Deploy FF MARGEDAR to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Upload application to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          if not token:
              raise RuntimeError('GitHub Actions secret HF_TOKEN is missing')

          api = HfApi(token=token)
          api.upload_folder(
              repo_id='Mahmadmurodov/ff-margedar-bot',
              repo_type='space',
              folder_path='.',
              commit_message='Deploy from GitHub Actions',
              ignore_patterns=[
                  '.git/**', '.github/**', '.env', '.env.*',
                  '.venv/**', 'venv/**', '__pycache__/**',
                  '*.pyc', '*.db', '*.sqlite3',
              ],
          )
          print('Upload to Hugging Face Space completed.')
          PY
