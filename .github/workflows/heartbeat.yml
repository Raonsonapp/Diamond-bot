name: Hugging Face Space Heartbeat

on:
  schedule:
    # GitHub Actions sends an external HTTP request every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Diamond Bot Space
        env:
          SPACE_URL: https://raonsonapp-diamond-bot.hf.space/
        run: |
          echo "Sending heartbeat to ${SPACE_URL}"
          curl --fail --silent --show-error \
            --location \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 45 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            "${SPACE_URL}"
